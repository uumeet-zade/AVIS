<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;1,400&amp;family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&amp;display=swap');
            
            .bg { fill: #FFFFFF; }
            .logo { 
                font-family: 'Playfair Display', serif; 
                font-size: 160px; 
                font-weight: 800; 
                letter-spacing: -0.02em;
                fill: #111111; 
                text-anchor: middle; 
            }
            .message { 
                font-family: 'Inter', sans-serif; 
                font-size: 40px; 
                font-style: italic; 
                fill: #111111; 
                text-anchor: middle; 
            }
            .founder { 
                font-family: 'Inter', sans-serif; 
                font-size: 32px; 
                font-weight: 500; 
                fill: #111111; 
                text-anchor: middle; 
            }
        </style>
    </defs>
    
    <!-- White Background -->
    <rect class="bg" width="100%" height="100%" />
    
    <!-- Text Elements -->
    <text x="600" y="380" class="logo">AVIS</text>
    <text x="600" y="480" class="message">'See you soon'</text>
    <text x="600" y="560" class="founder">- Aldric von Reichel</text>
</svg>
